# ============================================================================
# Nexus 权限管理平台 - 二进制发布流水线
# ============================================================================
#
# 交叉编译多平台二进制（纯 Go 无 CGO，前端已内嵌），产出：
#   - nexus-perm-linux-amd64.tar.gz
#   - nexus-perm-linux-arm64.tar.gz
#   - nexus-perm-darwin-amd64.tar.gz   (macOS Intel)
#   - nexus-perm-darwin-arm64.tar.gz   (macOS Apple Silicon)
#   - nexus-perm-windows-amd64.zip     (Windows x64, 内含 .exe)
#   - nexus-perm-windows-arm64.zip     (Windows ARM64)
# 以及每个文件的 sha256 校验值；Windows 目标按惯例打包为 zip。
#
# 触发方式：
#   - 推送 v* 标签（如 v1.0.0）：构建并发布为对应版本号的 Release
#     git tag v1.0.0 && git push origin v1.0.0
#
# 本地等价命令：
#   CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
#     go build -trimpath -o nexus-perm.exe .
# ============================================================================

name: release

on:
  push:
    tags: ['v*']

# 同一引用重复触发时取消旧构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: 构建 nexus-perm (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 计算版本号
        id: version
        run: |
          # 只认 v* 版本标签；没有则退化为 commit 短 SHA
          # （不能用裸 git describe：滚动 Release 的 tag 会被误当成版本号）
          VERSION=$(git describe --tags --always --match 'v*' 2>/dev/null || git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: 交叉编译
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          OUT="dist/nexus-perm-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then OUT="${OUT}.exe"; fi
          go build \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }} -X main.buildTime=${{ steps.version.outputs.build_time }}" \
            -trimpath \
            -o "$OUT" \
            .

      - name: 打包并生成校验和
        run: |
          cd dist
          NAME="nexus-perm-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "${NAME}.zip" "${NAME}.exe"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nexus-perm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*
          retention-days: 14
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成汇总校验和
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -lh

      # 标签推送 -> 以标签名直接创建版本 Release
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="Nexus Repository Manager 3 权限管理平台 ${TAG} - 多平台构建产物。

          来源：${GITHUB_SHA:0:7}

          ## 快速开始（Linux amd64）

          \`\`\`bash
          curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nexus-perm-linux-amd64.tar.gz
          tar -xzf nexus-perm-linux-amd64.tar.gz
          chmod +x nexus-perm-linux-amd64
          ./nexus-perm-linux-amd64 -addr 0.0.0.0:8080 -data ./data
          # 首次启动会打印/生成管理员密码，浏览器打开 http://<ip>:8080 登录
          \`\`\`

          Windows：下载 nexus-perm-windows-amd64.zip 解压得到 nexus-perm-windows-amd64.exe，
          重命名为 nexus-perm.exe 后双击或加入 PATH。

          Docker：\`docker run -d -p 8080:8080 -v nexus-perm-data:/data ghcr.io/${GITHUB_REPOSITORY}:${TAG}\`

          完整安装/配置说明见仓库 README.md。"

          gh release create "$TAG" \
            --title "nexus-perm ${TAG}" \
            --notes "$NOTES" \
            --latest \
            dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
